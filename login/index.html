<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">
    
</head>

<body>
    
    <main>

        <section id="login">

            <div id="imagem"></div>

            <div id="formulario">

                <h1>Login</h1>

                <p>Acesse sua conta:</p>
                
                <form action="login.php" method="post" autocomplete="on">

                    <div class="campo">
                        <label for="ilogin">Login:</label>
                        <input type="email" name="login" id="ilogin" placeholder=" Seu e-mail" autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label for="isenha">Senha:</label>
                        <input type="password" name="senha" id="isenha" placeholder="Letras e números" autocomplete="current-password" required minlength="8" maxlength="20">
                    </div>

                    <div class="entrar">
                        <input type="submit" value="Entrar"><br>
                        <a href="esqueciasenha.html">Esqueci a senha</a>
                    </div>

                </form>
            </div>

        </section>

    </main>

</body>
</html>
